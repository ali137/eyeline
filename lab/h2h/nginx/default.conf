server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name admin.lab-host.test;
    location / {
        proxy_pass http://dash:3000;
        proxy_set_header Host $host;
    }
}
